openapi: 3.0.3
info: {title: CAB - API Đánh giá tài xế, version: 1.0.0}
servers: [{url: http://localhost:8080/api}]
paths:
  /trips/{tripId}/ratings:
    post:
      summary: Đánh giá tài xế
      parameters:
        - {name: tripId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score: {type: integer, minimum: 1, maximum: 5}
                comment: {type: string}
      responses:
        '201': {description: Ghi nhận đánh giá thành công}

openapi: 3.0.3
info:
  title: Driver Management API
  version: 1.0.0
  description: CRUD API for operation staff to manage driver information.
servers:
  - url: /api
paths:
  /drivers:
    get:
      summary: List drivers
      operationId: listDrivers
      tags: [Operation]
      responses:
        '200': {description: Driver list returned.}
    post:
      summary: Create a driver account
      operationId: createDriverByStaff
      tags: [Operation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: {type: string}
                email: {type: string, format: email}
                phone: {type: string}
      responses:
        '201': {description: Driver account created.}
  /drivers/{driverId}:
    get:
      summary: Get driver
      operationId: getDriver
      tags: [Operation]
      parameters:
        - {in: path, name: driverId, required: true, schema: {type: string}}
      responses:
        '200': {description: Driver returned.}
        '404': {description: Driver not found.}
    put:
      summary: Update driver
      operationId: updateDriverByStaff
      tags: [Operation]
      parameters:
        - {in: path, name: driverId, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: {type: string}
                phone: {type: string}
                activityStatus: {type: string}
      responses:
        '200': {description: Driver updated.}
        '404': {description: Driver not found.}
    delete:
      summary: Delete driver
      operationId: deleteDriver
      tags: [Operation]
      parameters:
        - {in: path, name: driverId, required: true, schema: {type: string}}
      responses:
        '204': {description: Driver deleted.}
        '404': {description: Driver not found.}

openapi: 3.0.3
info:
  title: Trip Management API
  version: 1.0.0
  description: CRUD API for operation staff to monitor and manage trips.
servers:
  - url: /api
paths:
  /trips:
    get:
      summary: List trips
      operationId: listTrips
      tags: [Operation]
      responses:
        '200': {description: Trip list returned.}
    post:
      summary: Create a trip record
      operationId: createTrip
      tags: [Operation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bookingId: {type: string}
                driverId: {type: string}
      responses:
        '201': {description: Trip created.}
  /trips/{tripId}:
    get:
      summary: Get trip
      operationId: getTrip
      tags: [Operation]
      parameters:
        - {in: path, name: tripId, required: true, schema: {type: string}}
      responses:
        '200': {description: Trip returned.}
        '404': {description: Trip not found.}
    put:
      summary: Update trip
      operationId: updateTrip
      tags: [Operation]
      parameters:
        - {in: path, name: tripId, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: {type: string}
                driverId: {type: string}
      responses:
        '200': {description: Trip updated.}
        '404': {description: Trip not found.}
    delete:
      summary: Delete trip
      operationId: deleteTrip
      tags: [Operation]
      parameters:
        - {in: path, name: tripId, required: true, schema: {type: string}}
      responses:
        '204': {description: Trip deleted.}
        '404': {description: Trip not found.}

openapi: 3.0.3
info:
  title: Vehicle Management API
  version: 1.0.0
  description: API for drivers and operation staff to manage vehicle information.
servers:
  - url: /api
paths:
  /vehicles:
    get:
      summary: List vehicles
      operationId: listVehicles
      tags: [Operation]
      responses:
        '200': {description: Vehicle list returned.}
    post:
      summary: Create vehicle record
      operationId: createVehicle
      tags: [Operation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                driverId: {type: string}
                vehicleType: {type: string}
                licensePlate: {type: string}
      responses:
        '201': {description: Vehicle created.}
  /vehicles/{vehicleId}:
    get:
      summary: Get vehicle
      operationId: getVehicle
      tags: [Operation]
      parameters:
        - {in: path, name: vehicleId, required: true, schema: {type: string}}
      responses:
        '200': {description: Vehicle returned.}
        '404': {description: Vehicle not found.}
    put:
      summary: Update vehicle
      operationId: updateVehicle
      tags: [Operation]
      parameters:
        - {in: path, name: vehicleId, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicleType: {type: string}
                licensePlate: {type: string}
                status: {type: string}
      responses:
        '200': {description: Vehicle updated.}
        '404': {description: Vehicle not found.}
    delete:
      summary: Delete vehicle
      operationId: deleteVehicle
      tags: [Operation]
      parameters:
        - {in: path, name: vehicleId, required: true, schema: {type: string}}
      responses:
        '204': {description: Vehicle deleted.}
        '404': {description: Vehicle not found.}

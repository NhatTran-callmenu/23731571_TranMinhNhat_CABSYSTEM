openapi: 3.0.3
info:
  title: Electronic Payment Processing API
  version: 1.0.0
  description: API used to integrate CAB System with an external payment provider. Sensitive card/account data is not stored directly by CAB.
servers:
  - url: /api
paths:
  /payments/{paymentId}/process:
    post:
      summary: Process an electronic payment
      operationId: processElectronicPayment
      tags: [Payment]
      parameters:
        - in: path
          name: paymentId
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                providerReference: {type: string}
                callbackUrl: {type: string, format: uri}
      responses:
        '200':
          description: Payment provider returned a result.
        '400':
          description: Invalid payment request.
        '502':
          description: Payment provider unavailable or returned an error.

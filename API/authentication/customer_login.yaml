openapi: 3.0.3
info:
  title: Customer Login API
  version: 1.0.0
  description: API for customer authentication.
servers:
  - url: /api
paths:
  /customers/login:
    post:
      summary: Authenticate a customer
      operationId: loginCustomer
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
      responses:
        '200':
          description: Login successful.
        '401':
          description: Invalid credentials.

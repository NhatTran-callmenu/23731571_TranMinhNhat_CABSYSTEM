openapi: 3.0.3
info:
  title: Driver Profile Update API
  version: 1.0.0
  description: API for updating driver profile and activity information.
servers:
  - url: /api
paths:
  /drivers/{driverId}:
    put:
      summary: Update driver information
      operationId: updateDriver
      tags: [Authentication]
      parameters:
        - in: path
          name: driverId
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: {type: string}
                email: {type: string, format: email}
                phone: {type: string}
                activityStatus:
                  type: string
                  description: Driver availability/activity status.
      responses:
        '200':
          description: Driver information updated.
        '404':
          description: Driver not found.

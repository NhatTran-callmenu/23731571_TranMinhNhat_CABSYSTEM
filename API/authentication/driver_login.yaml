openapi: 3.0.3
info:
  title: Driver Login API
  version: 1.0.0
  description: API for driver authentication.
servers:
  - url: /api
paths:
  /drivers/login:
    post:
      summary: Authenticate a driver
      operationId: loginDriver
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
      responses:
        '200':
          description: Login successful.
        '401':
          description: Invalid credentials.

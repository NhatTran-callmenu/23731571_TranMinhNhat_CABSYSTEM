openapi: 3.0.3
info:
  title: Driver Registration API
  version: 1.0.0
  description: API for driver account registration.
servers:
  - url: /api
paths:
  /drivers/register:
    post:
      summary: Register a driver account
      operationId: registerDriver
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, password]
              properties:
                fullName: {type: string}
                email: {type: string, format: email}
                password: {type: string, format: password}
                phone: {type: string}
      responses:
        '201':
          description: Driver account created successfully.
        '400':
          description: Invalid registration information.
        '409':
          description: Account already exists.

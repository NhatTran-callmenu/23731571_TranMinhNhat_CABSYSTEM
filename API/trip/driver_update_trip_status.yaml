openapi: 3.0.3
info:
  title: Trip Status API
  version: 1.0.0
  description: API for a driver to update trip status during trip execution.
servers:
  - url: /api
paths:
  /trips/{tripId}/status:
    put:
      summary: Update trip status
      operationId: updateTripStatus
      tags: [Trip]
      parameters:
        - in: path
          name: tripId
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ARRIVED_PICKUP, PICKED_UP, IN_PROGRESS, COMPLETED]
      responses:
        '200':
          description: Trip status updated.
        '400':
          description: Invalid status transition.
        '404':
          description: Trip not found.

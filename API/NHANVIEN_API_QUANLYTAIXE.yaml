openapi: 3.0.3
info:
  title: CAB - API Quản lý tài xế
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
tags:
  - name: Nhân viên vận hành
paths:
  /operations/drivers:
    get:
      tags: [Nhân viên vận hành]
      summary: Lấy danh sách tài xế
      responses:
        '200': {description: Danh sách tài xế}
    post:
      tags: [Nhân viên vận hành]
      summary: Tạo tài khoản hồ sơ tài xế
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverRequest' }
      responses:
        '201': {description: Tạo tài xế thành công}
  /operations/drivers/{driverId}:
    get:
      tags: [Nhân viên vận hành]
      summary: Xem chi tiết tài xế
      parameters:
        - {name: driverId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Thông tin tài xế}
        '404': {description: Không tìm thấy tài xế}
    put:
      tags: [Nhân viên vận hành]
      summary: Cập nhật tài xế
      parameters:
        - {name: driverId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverRequest' }
      responses:
        '200': {description: Cập nhật thành công}
    delete:
      tags: [Nhân viên vận hành]
      summary: Xóa tài xế
      parameters:
        - {name: driverId, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Xóa thành công}
components:
  schemas:
    DriverRequest:
      type: object
      required: [fullName, phone]
      properties:
        fullName: {type: string, example: Trần Văn B}
        phone: {type: string, example: "0912345678"}
        licenseNumber: {type: string, example: B2-123456}
        status: {type: string, enum: [ACTIVE, INACTIVE, SUSPENDED], example: ACTIVE}
        availability: {type: string, enum: [AVAILABLE, BUSY, OFFLINE], example: AVAILABLE}

openapi: 3.0.3
info:
  title: CAB - API Quản lý hồ sơ tài xế
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
paths:
  /drivers/me:
    get:
      summary: Xem hồ sơ tài xế
      responses:
        '200': {description: Hồ sơ tài xế}
    put:
      summary: Cập nhật hồ sơ tài xế
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileRequest'}
      responses:
        '200': {description: Cập nhật thành công}
  /drivers/me/vehicles:
    get:
      summary: Danh sách phương tiện của tài xế
      responses:
        '200': {description: Danh sách phương tiện}
    post:
      summary: Thêm phương tiện
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VehicleRequest'}
      responses:
        '201': {description: Thêm phương tiện thành công}
  /drivers/me/vehicles/{vehicleId}:
    get:
      summary: Xem phương tiện
      parameters:
        - {name: vehicleId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Thông tin phương tiện}
    put:
      summary: Cập nhật phương tiện
      parameters:
        - {name: vehicleId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VehicleRequest'}
      responses:
        '200': {description: Cập nhật thành công}
    delete:
      summary: Xóa phương tiện
      parameters:
        - {name: vehicleId, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Xóa thành công}
components:
  schemas:
    ProfileRequest:
      type: object
      properties:
        fullName: {type: string, example: Trần Văn B}
        phone: {type: string, example: "0912345678"}
        licenseNumber: {type: string, example: B2-123456}
    VehicleRequest:
      type: object
      required: [licensePlate, vehicleType]
      properties:
        licensePlate: {type: string, example: 51A-123.45}
        vehicleType: {type: string, enum: [MOTORBIKE, CAR], example: CAR}
        brand: {type: string, example: Toyota}
        model: {type: string, example: Vios}
        status: {type: string, enum: [ACTIVE, INACTIVE], example: ACTIVE}

openapi: 3.0.3
info: {title: CAB - API Đăng ký tài khoản, version: 1.0.0}
servers: [{url: http://localhost:8080/api}]
paths:
  /customers/register:
    post:
      summary: Đăng ký tài khoản khách hàng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, phone, password]
              properties:
                fullName: {type: string}
                phone: {type: string}
                password: {type: string, format: password}
      responses:
        '201': {description: Đăng ký thành công}
        '409': {description: Tài khoản đã tồn tại}

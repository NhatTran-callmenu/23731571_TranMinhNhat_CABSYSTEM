openapi: 3.0.3
info:
  title: CAB - API Tra cứu lịch sử giao dịch
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
tags:
  - name: Nhân viên vận hành
paths:
  /operations/payments:
    get:
      tags: [Nhân viên vận hành]
      summary: Tra cứu danh sách giao dịch
      parameters:
        - {name: status, in: query, schema: {type: string}}
        - {name: tripId, in: query, schema: {type: string}}
      responses:
        '200': {description: Danh sách giao dịch}
  /operations/payments/{paymentId}:
    get:
      tags: [Nhân viên vận hành]
      summary: Xem chi tiết giao dịch
      parameters:
        - {name: paymentId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Chi tiết giao dịch}
        '404': {description: Không tìm thấy giao dịch}
    put:
      tags: [Nhân viên vận hành]
      summary: Cập nhật trạng thái xử lý giao dịch
      description: Dùng để cập nhật trạng thái nghiệp vụ của giao dịch; không sửa dữ liệu nhạy cảm của phương thức thanh toán.
      parameters:
        - {name: paymentId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentUpdateRequest' }
      responses:
        '200': {description: Cập nhật thành công}
components:
  schemas:
    PaymentUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED, REFUNDED]
          example: SUCCESS
        note:
          type: string
          example: Đã đối soát giao dịch.

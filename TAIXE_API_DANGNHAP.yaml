openapi: 3.0.3
info: {title: CAB - API Đăng nhập tài xế, version: 1.0.0}
servers: [{url: http://localhost:8080/api}]
paths:
  /drivers/login:
    post:
      summary: Đăng nhập tài xế
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: {type: string}
                password: {type: string, format: password}
      responses:
        '200': {description: Đăng nhập thành công}
        '401': {description: Sai thông tin đăng nhập}

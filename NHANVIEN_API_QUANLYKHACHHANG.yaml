openapi: 3.0.3
info:
  title: CAB - API Quản lý khách hàng
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
tags:
  - name: Nhân viên vận hành
paths:
  /operations/customers:
    get:
      tags: [Nhân viên vận hành]
      summary: Lấy danh sách khách hàng
      responses:
        '200':
          description: Danh sách khách hàng
    post:
      tags: [Nhân viên vận hành]
      summary: Tạo khách hàng
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerRequest' }
      responses:
        '201':
          description: Tạo khách hàng thành công
        '409':
          description: Khách hàng đã tồn tại
  /operations/customers/{customerId}:
    get:
      tags: [Nhân viên vận hành]
      summary: Xem chi tiết khách hàng
      parameters:
        - {name: customerId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Thông tin khách hàng}
        '404': {description: Không tìm thấy khách hàng}
    put:
      tags: [Nhân viên vận hành]
      summary: Cập nhật khách hàng
      parameters:
        - {name: customerId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerRequest' }
      responses:
        '200': {description: Cập nhật thành công}
        '404': {description: Không tìm thấy khách hàng}
    delete:
      tags: [Nhân viên vận hành]
      summary: Xóa khách hàng
      parameters:
        - {name: customerId, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Xóa thành công}
        '404': {description: Không tìm thấy khách hàng}
components:
  schemas:
    CustomerRequest:
      type: object
      required: [fullName, phone]
      properties:
        fullName: {type: string, example: Nguyễn Văn A}
        phone: {type: string, example: "0901234567"}
        email: {type: string, format: email, example: nguyenvana@example.com}
        status: {type: string, enum: [ACTIVE, INACTIVE], example: ACTIVE}

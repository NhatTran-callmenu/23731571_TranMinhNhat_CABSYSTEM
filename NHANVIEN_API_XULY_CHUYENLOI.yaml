openapi: 3.0.3
info:
  title: CAB - API Xử lý chuyến bị lỗi
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
tags:
  - name: Nhân viên vận hành
paths:
  /operations/trip-errors:
    get:
      tags: [Nhân viên vận hành]
      summary: Lấy danh sách chuyến bị lỗi
      responses:
        '200': {description: Danh sách lỗi chuyến}
    post:
      tags: [Nhân viên vận hành]
      summary: Ghi nhận chuyến bị lỗi
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripErrorRequest' }
      responses:
        '201': {description: Ghi nhận thành công}
  /operations/trip-errors/{errorId}:
    get:
      tags: [Nhân viên vận hành]
      summary: Xem chi tiết lỗi chuyến
      parameters:
        - {name: errorId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Chi tiết lỗi}
        '404': {description: Không tìm thấy lỗi}
    put:
      tags: [Nhân viên vận hành]
      summary: Cập nhật xử lý lỗi chuyến
      parameters:
        - {name: errorId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripErrorUpdateRequest' }
      responses:
        '200': {description: Cập nhật xử lý thành công}
    delete:
      tags: [Nhân viên vận hành]
      summary: Xóa bản ghi lỗi chuyến
      description: Chỉ xóa bản ghi lỗi tạo nhầm; không xóa lịch sử xử lý đã hoàn tất.
      parameters:
        - {name: errorId, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Xóa thành công}
components:
  schemas:
    TripErrorRequest:
      type: object
      required: [tripId, errorType, description]
      properties:
        tripId: {type: string, example: TRIP001}
        errorType: {type: string, example: DRIVER_NO_SHOW}
        description: {type: string, example: Tài xế không đến điểm đón.}
    TripErrorUpdateRequest:
      type: object
      required: [status, resolution]
      properties:
        status:
          type: string
          enum: [PROCESSING, RESOLVED]
          example: RESOLVED
        resolution: {type: string, example: Đã hỗ trợ khách hàng đổi chuyến.}

openapi: 3.0.3
info: {title: CAB - API Thực hiện chuyến, version: 1.0.0}
servers: [{url: http://localhost:8080/api}]
paths:
  /drivers/trips/{tripId}/status:
    patch:
      summary: Cập nhật trạng thái chuyến
      parameters:
        - {name: tripId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ARRIVED_PICKUP, PICKED_UP, IN_PROGRESS, COMPLETED]
      responses:
        '200': {description: Cập nhật thành công}

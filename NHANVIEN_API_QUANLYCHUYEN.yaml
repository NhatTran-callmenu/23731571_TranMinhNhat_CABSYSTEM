openapi: 3.0.3
info:
  title: CAB - API Quản lý chuyến đi
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
tags:
  - name: Nhân viên vận hành
paths:
  /operations/trips:
    get:
      tags: [Nhân viên vận hành]
      summary: Lấy danh sách chuyến đi
      parameters:
        - {name: status, in: query, schema: {type: string}}
      responses:
        '200': {description: Danh sách chuyến đi}
    post:
      tags: [Nhân viên vận hành]
      summary: Tạo bản ghi chuyến đi
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripRequest' }
      responses:
        '201': {description: Tạo chuyến thành công}
  /operations/trips/{tripId}:
    get:
      tags: [Nhân viên vận hành]
      summary: Xem chi tiết chuyến đi
      parameters:
        - {name: tripId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Chi tiết chuyến đi}
        '404': {description: Không tìm thấy chuyến}
    put:
      tags: [Nhân viên vận hành]
      summary: Cập nhật thông tin chuyến đi
      parameters:
        - {name: tripId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripRequest' }
      responses:
        '200': {description: Cập nhật thành công}
    delete:
      tags: [Nhân viên vận hành]
      summary: Xóa bản ghi chuyến đi
      description: Chỉ dùng cho bản ghi tạo nhầm/chưa phát sinh nghiệp vụ; không xóa chuyến đã hoàn thành để bảo đảm lịch sử.
      parameters:
        - {name: tripId, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Xóa thành công}
        '409': {description: Không thể xóa chuyến đã phát sinh nghiệp vụ}
components:
  schemas:
    TripRequest:
      type: object
      required: [customerId, pickupLocation, destination]
      properties:
        customerId: {type: string, example: CUS001}
        driverId: {type: string, nullable: true, example: DRV001}
        pickupLocation: {type: string, example: Đại học Công nghiệp TP.HCM}
        destination: {type: string, example: Sân bay Tân Sơn Nhất}
        status:
          type: string
          enum: [SEARCHING_DRIVER, DRIVER_ASSIGNED, IN_PROGRESS, COMPLETED, CANCELLED]
          example: DRIVER_ASSIGNED

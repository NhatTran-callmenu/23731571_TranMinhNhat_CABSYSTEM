openapi: 3.0.3
info: {title: CAB - API Theo dõi chuyến, version: 1.0.0}
servers: [{url: http://localhost:8080/api}]
paths:
  /trips/{tripId}/tracking:
    get:
      summary: Theo dõi trạng thái chuyến
      parameters:
        - {name: tripId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Thông tin theo dõi chuyến}
        '404': {description: Không tìm thấy chuyến}
